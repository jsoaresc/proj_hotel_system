spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/hotel_db
    username: admin
    password: admin_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true